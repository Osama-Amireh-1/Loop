name: k6 Performance Smoke

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  k6-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/Loop.sln

      - name: Build
        run: dotnet build ./src/Loop.sln --configuration Release --no-restore

      - name: Start API
        run: |
          dotnet run --project ./src/Loop.Web.Api/Loop.Web.Api.csproj --configuration Release --urls http://127.0.0.1:5000 > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat api.log
          exit 1

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: ./performance/k6/api-smoke.js
        env:
          BASE_URL: http://127.0.0.1:5000

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
